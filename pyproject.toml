[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mage"
version = "0.1.0"
description = "GPU profiler TUI for Triton/CUDA kernels with nsys/ncu integration"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "triton>=3.0.0",
    "rich>=13.0.0",
    "numpy>=2.2.6",
    "textual>=6.8.0",
]

[project.scripts]
mage = "mage.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-xdist",
    "textual-dev>=1.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
