name: triton-triton-profiler-gpu

on:
  workflow_dispatch:
    inputs:
      script:
        description: Profiling script to run
        required: false
        default: test_profile.py

jobs:
  triton-profile:
    name: Run Triton profiler on GPU hosted runner
    runs-on: magic-cabinet-mage-gpu
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify CUDA is available
        run: |
          python - <<'PY'
          import torch

          print("torch:", torch.__version__)
          print("cuda_available:", torch.cuda.is_available())
          if not torch.cuda.is_available():
            raise SystemExit("CUDA is not available on this runner.")
          print("cuda_device:", torch.cuda.get_device_name(0))
          print("cuda_version:", torch.version.cuda)
          PY

      - name: Run triton profile script
        run: |
          mage profile "${{ github.event.inputs.script || 'test_profile.py' }}" --backend triton
